// ====== situação do pagamento (automática, exceto "Pago", que é marcado à mão) ======
function pay(o){
  if(o.status==='CANCELADA')return['Não elegível','p-nao'];
  if(o.pago)return['Pago','p-pago'];
  if(o.status!=='INSTALADA'||!o.instalado)return['Pendente instalação','p-pend'];
  return iso(payday(o.instalado))<=iso(sexta(now,4))?['Será pago essa semana','p-sem']:['Será pago na próxima semana','p-prox'];
}

const DB={
  async load(){
    if(S.sb){const{data,error}=await S.sb.rpc('listar',S.cred);if(error)throw error;return data}
    try{const t=localStorage.getItem('ordens');if(t)return JSON.parse(t)}catch(_){}
    return seed();
  },
  async save(o){
    if(S.sb){const{error}=await S.sb.rpc('salvar',{...S.cred,o});if(error)throw error}
    else{const i=S.data.findIndex(x=>x.id===o.id);i<0?S.data.push(o):S.data[i]=o;this.local()}
  },
  async del(id){if(S.sb){const{error}=await S.sb.rpc('excluir',{...S.cred,i:id});if(error)throw error;S.data=S.data.filter(x=>x.id!==id)}else{S.data=S.data.filter(x=>x.id!==id);this.local()}},
  local(){try{localStorage.setItem('ordens',JSON.stringify(S.data))}catch(_){}}
};
function seed(){
  let r=7;const R=n=>(r=(r*9301+49297)%233280)/233280*n|0;
  const nomes=['Osmar Cardoso','Maria Sonia','Adriano Queiroz','Guilherme Luck','Roberval Paulino','Mariane Lopes','Daniel Chaves','Luciana Camapa','Ladjane Maria','Alexandre Sartori'],cons=['Ricardo','Wandeison','Lenildo','Pedro','Lannart','Thawany','Bruna'],st=['INSTALADA','INSTALADA','INSTALADA','ANDAMENTO','PENDENCIADA','CANCELADA'];
  const out=[];for(let i=0;i<70;i++){const d=new Date(now.getFullYear(),now.getMonth()-R(2),1+R(27)),s=st[R(6)];
    const o={id:'d'+i,data:iso(d),loja:LOJAS[R(10)],cliente:nomes[R(10)]+' '+(i+1),cpf:String(10000000000+R(8e8)).slice(0,11),ordem:'1-'+(9e8+R(1e8)),plano:R(5)?'COMBO':'AVULSA',status:s,info:s==='INSTALADA'?'':'Aguardando cliente',instalado:s==='INSTALADA'?iso(new Date(d.getTime()+864e5*(1+R(4)))):'',consultor:cons[R(7)],pago:false};
    if(o.instalado&&iso(payday(o.instalado))<iso(sexta(now,4))&&R(4))o.pago=true;out.push(o)}
  return out;
}

function stats(L){const t=L.length,c=L.filter(o=>o.status==='INSTALADA').length;

  $('#v').innerHTML=`<div class="card"><div class="tools"><input id="q" placeholder="Buscar por nome, CPF ou ordem" value="${e(f.q)}">
  ${vendoTudo()?`<select id="fl"><option value="">Todas as lojas${LOJAS.map(l=>`<option ${f.loja===l?'selected':''}>${l}`).join('')}</select>`:''}
  <select id="fs"><option value="">Todos os status${Object.entries(STAT).map(([k,v])=>`<option value="${k}" ${f.status===k?'selected':''}>${v}`).join('')}</select>
  <select id="fp"><option value="">Todos os pagamentos${['Pago','Será pago essa semana','Será pago na próxima semana','Pendente instalação','Não elegível'].map(v=>`<option ${f.pago===v?'selected':''}>${v}`).join('')}</select></div>
  <div id="res"></div></div>`;
  const lista=()=>{const f=S.f,q=f.q.toLowerCase();
    const R=L.filter(o=>(!f.loja||o.loja===f.loja)&&(!f.status||o.status===f.status)&&(!f.pago||pay(o)[0]===f.pago)&&(!q||(o.cliente+o.cpf+o.ordem).toLowerCase().includes(q)));
    $('#res').innerHTML=`<p style="color:var(--mut)">${R.length} venda(s). ${podeEditar()?'Toque em uma linha para editar.':'Toque em uma linha para ver os detalhes.'}</p>${tabela(R,'Nenhuma venda encontrada com esses filtros.')}`;abrir()};
  const ap=()=>{S.f={q:$('#q').value,loja:$('#fl')?.value||'',status:$('#fs').value,pago:$('#fp').value};lista()};
  ['fl','fs','fp'].forEach(i=>$('#'+i)&&($('#'+i).onchange=ap));
  $('#q').oninput=ap;
  lista();
}
function acessos(){
  const all=[...LOJAS.map(l=>[slug(l),l,'Loja',lc(l)]),...PESSOAS.map(p=>[p[0],p[1],p[0]==='adm'?'Administrador':'Equipe',p[2]])];
  $('#v').innerHTML=`<div class="card"><h2>Acessos e senhas</h2><p class="hint">Escolha quem vai receber uma senha nova e toque em "Redefinir senha". A nova senha vale na hora.</p><table><tr><th>Quem<th>Tipo<th></tr>${all.map(a=>`<tr><td><span class="dot" style="background:${a[3]}"></span>${e(a[1])}<td>${a[2]}<td><button class="btn" data-k="${a[0]}" data-n="${e(a[1])}">Redefinir senha</button></tr>`).join('')}</table></div>`;
  document.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{
    const m=document.createElement('div');m.className='modal';
    m.innerHTML=`<div class="box"><h2 style="margin-top:0;color:var(--az2)">Nova senha de ${b.dataset.n}</h2><div class="f"><label class="full">Digite a nova senha (mínimo 4 caracteres)<input id="ns" type="text" autocomplete="off"></label></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn gh" id="x">Cancelar</button><button class="btn" id="ok">Salvar senha</button></div></div>`;
    document.body.append(m);$('#ns').focus();$('#x').onclick=()=>m.remove();
    $('#ok').onclick=async()=>{const n=$('#ns').value;if(n.length<4){toast('A senha precisa ter pelo menos 4 caracteres.');return}
      try{if(S.sb){const{error}=await S.sb.rpc('senha_definir',{...S.cred,alvo:b.dataset.k,nova:n});if(error)throw error}
        else{DEMO[b.dataset.k].senha=n;const t=JSON.parse(localStorage.getItem('senhas')||'{}');t[b.dataset.k]=n;localStorage.setItem('senhas',JSON.stringify(t));
          if(b.dataset.k==='adm')S.cred.s=n}
        if(S.sb&&b.dataset.k===S.cred.k)S.cred.s=n;
        m.remove();toast('Senha de '+b.dataset.n+' atualizada')}catch(_){toast('Não foi possível trocar a senha. Tente de novo.')}};
  });
}
function pendenciadas(){
  const R=visiveis().filter(o=>o.status==='PENDENCIADA').sort((a,b)=>b.data.localeCompare(a.data));
  $('#v').innerHTML=`<div class="card"><h2>Todas as vendas pendenciadas (todos os meses)</h2><p style="color:var(--mut)">${R.length} venda(s) aguardando solução. Toque para atualizar o status.</p>${tabela(R,'Nenhuma pendenciada. Tudo certo!')}</div>`;abrir();
}
function form(o){
  const novo=!o;o=o||{id:'n'+Date.now(),data:iso(now),loja:U().loja||LOJAS[0],cliente:'',cpf:'',ordem:'',plano:'COMBO',status:'ANDAMENTO',info:'',instalado:'',consultor:'',pago:false};
  const ro=!podeEditar()||(U().papel==='loja'&&o.loja!==U().loja),dis=ro?'disabled':'';
  const I=(k,l,t='text',x='')=>`<label class="${x}">${l}<input type="${t}" id="f_${k}" value="${e(o[k])}" ${dis}></label>`;
  const SEL=(k,l,opts)=>`<label>${l}<select id="f_${k}" ${dis||(k==='loja'&&!vendoTudo()?'disabled':'')}>${opts.map(([v,t])=>`<option value="${v}" ${o[k]===v?'selected':''}>${t}`).join('')}</select></label>`;
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box"><h2 style="margin-top:0;color:var(--az2)">${novo?'Nova venda':ro?'Detalhes da venda':'Editar venda'}</h2><div class="f">
  ${I('data','Data da venda','date')}${SEL('loja','Loja',LOJAS.map(l=>[l,l]))}${I('cliente','Nome do cliente','text','full')}${I('cpf','CPF')}${I('ordem','Número da ordem')}
  ${SEL('plano','Plano',[['COMBO','Combo'],['AVULSA','Avulsa']])}${SEL('status','Status',Object.entries(STAT))}${I('instalado','Data da instalação','date')}${I('consultor','Consultor')}${I('info','Informações adicionais','text','full')}
  <label class="full" style="flex-direction:row;align-items:center;gap:8px;font-size:15px;color:var(--tx)"><input type="checkbox" id="f_pago" ${o.pago?'checked':''} ${dis} style="width:auto"> Comissão já foi paga</label></div>
  <p class="hint" id="ph" style="margin-top:12px"></p>
  <div class="actions"><button class="btn gh" id="x">${ro?'Fechar':'Cancelar'}</button>
  ${!ro&&!novo&&['adm','rivaldo'].includes(U().papel)?'<button class="btn vm" id="del">Excluir</button>':''}${ro?'':'<button class="btn" id="ok">Salvar</button>'}</div></div>`;
  document.body.append(m);
  const lerF=()=>{['data','loja','cliente','cpf','ordem','plano','status','info','instalado','consultor'].forEach(k=>o[k]=$('#f_'+k).value.trim());o.pago=$('#f_pago').checked};
  const prev=()=>{lerF();const p=pay(o);$('#ph').innerHTML=`Pagamento: <span class="tag ${p[1]}">${p[0]}</span>${o.status==='INSTALADA'&&o.instalado?' · sexta de pagamento: <b>'+br(iso(payday(o.instalado)))+'</b>':''}`};
  m.querySelectorAll('input,select').forEach(i=>i.oninput=prev);prev();
  $('#x').onclick=()=>m.remove();
  if($('#del'))$('#del').onclick=async()=>{if(confirm('Excluir esta venda? Não dá para desfazer.')){try{await DB.del(o.id);m.remove();draw();toast('Venda excluída')}catch(_){toast('Não foi possível excluir. Tente de novo.')}}};
  if($('#ok'))$('#ok').onclick=async()=>{lerF();
    if(!o.cliente||!o.data){toast('Preencha a data e o nome do cliente.');return}
    if(o.status==='INSTALADA'&&!o.instalado){toast('Informe a data da instalação.');return}
    try{await DB.save({...o,instalado:o.instalado||null});if(!o.instalado)o.instalado='';m.remove();if(S.sb)S.data=await DB.load();draw();toast('Venda salva')}catch(_){toast('Não foi possível salvar. Tente de novo.')}};
}
// ====== início ======
if(SUPA_URL&&SUPA_KEY&&window.supabase)S.sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
login();
</script></body></html>
